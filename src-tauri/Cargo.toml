[package]
name = "cadence-core"
version = "0.1.0"
description = "Cadence Core - Relational Audiophile Music Engine & Native Player"
authors = ["matbhuvi"]
edition = "2021"
default-run = "cadence-core"

[lib]
name = "cadence_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cadence-core"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cadence-headless"
path = "src/bin/cadence_headless.rs"

[[bin]]
name = "cadence-engine"
path = "src/bin/cadence_engine.rs"
required-features = ["engine-audio"]

[[test]]
name = "curate_identity"
path = "tests/curate_identity.rs"
required-features = ["desktop"]

[[test]]
name = "debug_off_zero_alloc"
path = "tests/debug_off_zero_alloc.rs"
required-features = ["desktop"]

[[test]]
name = "remote_queue_test"
path = "tests/remote_queue_test.rs"
required-features = ["desktop"]

[[test]]
name = "scanner_engine_contract_test"
path = "tests/scanner_engine_contract_test.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
engine-audio = [
    "bundled-sqlite",
    "dep:socket2",
    "dep:rodio",
    "dep:cpal",
    "dep:symphonia",
    "dep:walkdir",
    "dep:rusty-chromaprint",
    "dep:local-ip-address",
    "dep:mdns-sd",
    "dep:windows",
]
desktop = [
    "engine-audio",
    "bundled-sqlite",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-window-state",
    "dep:tauri-plugin-single-instance",
    "dep:rodio",
    "dep:cpal",
    "dep:symphonia",
    "dep:base64",
    "dep:walkdir",
    "dep:chrono-tz",
    "dep:httpdate",
    "dep:socket2",
    "dep:axum",
    "dep:axum-server",
    "dep:futures-util",
    "dep:tower",
    "dep:tower-http",
    "dep:local-ip-address",
    "dep:rusty-chromaprint",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:mdns-sd",
    "dep:windows",
]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [], optional = true }

[dependencies]
tauri = { version = "~2.11.6", features = ["protocol-asset", "tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all", "flac", "wav", "mp3", "vorbis"], optional = true }
cpal = { version = "0.15", optional = true }
symphonia = { version = "0.5", features = ["all"], optional = true }
lofty = { version = "0.21" }
base64 = { version = "0.22", optional = true }
parking_lot = "0.12"
walkdir = { version = "2", optional = true }
rusqlite = { version = "0.31", features = ["blob"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", optional = true }
httpdate = { version = "1", optional = true }
socket2 = { version = "0.6", optional = true }
axum = { version = "0.7", default-features = false, features = ["ws", "tokio", "http1", "json", "query"], optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
futures-util = { version = "0.3", optional = true }
tower = { version = "0.5", features = ["limit"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
local-ip-address = { version = "0.6", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusty-chromaprint = { version = "0.3.0", optional = true }
tauri-plugin-window-state = { version = "~2.4.1", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rust-embed = { version = "8.5", features = ["interpolate-folder-path", "compression"], optional = true }
rcgen = { version = "0.13" }
rustls-pemfile = { version = "2" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mime_guess = { version = "2.0", optional = true }
reqwest = { version = "0.13.5", features = ["json", "query"] }
sha2 = "0.10"
mdns-sd = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", optional = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Media",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = "1"

[profile.release]
strip = "symbols"
lto = "thin"

