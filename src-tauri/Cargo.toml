[package]
name = "cadence-core"
version = "0.1.0"
description = "Cadence Core - Relational Audiophile Music Engine & Native Player"
authors = ["matbhuvi"]
edition = "2021"

[lib]
name = "cadence_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all", "flac", "wav", "mp3", "vorbis"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.21"
base64 = "0.22"
parking_lot = "0.12"
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
