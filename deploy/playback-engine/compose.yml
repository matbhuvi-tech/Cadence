# Cadence Playback Engine — Standard Profile (DEFAULT)
# Enables runtime SMB share mounting (mount.cifs) and optional Curate tag writes.
# Requires root (0:0), SYS_ADMIN, DAC_READ_SEARCH, and apparmor:unconfined for kernel CIFS mounts.
# For non-root read-only local/NAS mounts without runtime SMB, use compose.hardened.yml instead.
services:
  playback-engine:
    image: ${CADENCE_IMAGE:?Set CADENCE_IMAGE to a published version or digest}
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [IPC_LOCK, SYS_ADMIN, DAC_READ_SEARCH]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    security_opt:
      - "no-new-privileges:true"
      - "apparmor:unconfined"
    mem_limit: 4g
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    environment:
      CADENCE_ADVERTISED_IP: ${CADENCE_ADVERTISED_IP:?Set the host LAN IPv4 address}
      CADENCE_LABEL: ${CADENCE_LABEL:-Cadence Playback Engine}
      CADENCE_BROWSE_ROOTS: /music
      CADENCE_MUSIC_READ_ONLY: "false"
    volumes:
      - type: bind
        source: ${CADENCE_HOST_DATA_DIR:?Set an existing writable data directory}
        target: /var/lib/cadence
        bind:
          create_host_path: false
      # LOCAL_MUSIC_VOLUME_START
      - type: bind
        source: ${CADENCE_HOST_MUSIC_DIR:?Set an existing music directory}
        target: /music
        read_only: false
        bind:
          create_host_path: false
      # LOCAL_MUSIC_VOLUME_END
