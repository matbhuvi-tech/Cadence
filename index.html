<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence Core | Relational Music Engine & Library Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Zero-Dependency Pre-React Crash Guard
      // Prevents any silent blank screen if an ES module or inline script fails before React mounts
      (function() {
        function displayEmergencyCrash(title, message, detail) {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            root.innerHTML = '' +
              '<div style="background:#0C0D10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;box-sizing:border-box;">' +
                '<div style="background:#16171B;border:1px solid rgba(244,63,94,0.3);border-radius:16px;max-width:680px;width:100%;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);">' +
                  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">' +
                    '<div style="width:12px;height:12px;border-radius:50%;background:#F43F5E;"></div>' +
                    '<h2 style="margin:0;font-size:16px;font-weight:600;color:#F5F5F7;letter-spacing:0.025em;">' + title + '</h2>' +
                  '</div>' +
                  '<p style="margin:0 0 16px 0;font-size:13px;color:#FDA4AF;line-height:1.5;">' + message + '</p>' +
                  (detail ? '<pre style="margin:0 0 20px 0;background:#0C0D10;padding:16px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);color:#8E8E93;font-size:11px;overflow:auto;max-height:260px;white-space:pre-wrap;">' + detail + '</pre>' : '') +
                  '<button onclick="window.location.reload()" style="background:#D4AF37;color:#0C0D10;border:none;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">Reload Application</button>' +
                '</div>' +
              '</div>';
          }
        }

        window.addEventListener('error', function(event) {
          console.error('[Pre-React Error]', event);
          var detail = event.error && event.error.stack ? event.error.stack : (event.filename + ':' + event.lineno + ':' + event.colno);
          displayEmergencyCrash('Cadence Runtime Exception', event.message || 'Script error occurred before React mounted.', detail);
        });

        window.addEventListener('unhandledrejection', function(event) {
          console.error('[Pre-React Unhandled Rejection]', event);
          var reason = event.reason;
          var detail = reason && reason.stack ? reason.stack : (typeof reason === 'string' ? reason : JSON.stringify(reason));
          displayEmergencyCrash('Cadence Unhandled Promise Rejection', (reason && reason.message) || 'Unhandled promise rejection before React mounted.', detail);
        });
      })();
    </script>
  </head>
  <body class="bg-[#0D0E12] text-[#F1F5F9] antialiased selection:bg-[#00F5FF]/20 selection:text-[#00F5FF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
