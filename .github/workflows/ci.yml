name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed subsystems
    runs-on: ubuntu-24.04
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "pwa=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^pwa/'; then
            echo "pwa=true" >> "$GITHUB_OUTPUT"
          else
            echo "pwa=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-and-pwa:
    name: Frontend & PWA (Lint, Build, Tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pwa/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix pwa

      - name: Lint frontend
        run: npm run lint

      - name: Type-check and build Desktop + PWA
        run: |
          npm run build
          npm run typecheck:tests

      - name: Run Vitest unit & interactive UI suite with coverage
        run: npm run test:coverage

      - name: Publish frontend coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total;
              const lines = [
                '### Frontend & PWA Coverage (Vitest v8)',
                '| Metric | Covered | Total | % |',
                '| --- | ---: | ---: | ---: |',
                ...['lines','statements','functions','branches'].map(k =>
                  '| ' + k + ' | ' + s[k].covered + ' | ' + s[k].total + ' | ' + s[k].pct + '% |'
                ),
              ];
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            "
          fi

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  rust-linux-headless:
    name: Rust Linux Headless & Packaging Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Node test dependencies (tsx for cross-language contract test)
        run: npm ci

      - name: Install ffmpeg for real-media acceptance fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run headless Rust unit & integration tests with coverage
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l
          cargo llvm-cov --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features bundled-sqlite --summary-only --json --output-path rust-coverage.json

      - name: Publish Rust headless coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f rust-coverage.json ]; then
            python3 -c "
          import json, os
          totals = json.load(open('rust-coverage.json'))['data'][0]['totals']
          rows = [
              '### Rust Linux Headless Coverage (cargo-llvm-cov)',
              '| Metric | Covered | Total | % |',
              '| --- | ---: | ---: | ---: |',
          ]
          for k in ('lines', 'functions', 'regions'):
              m = totals[k]
              rows.append(f'| {k} | {m[\"covered\"]} | {m[\"count\"]} | {m[\"percent\"]:.2f}% |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(rows) + '\n')
          "
          fi

      - name: Upload Rust coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-headless-coverage
          path: rust-coverage.json
          retention-days: 14

      - name: Build cadence-headless and run HTTP acceptance tests
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features bundled-sqlite --bin cadence-headless
          CADENCE_ENGINE_BINARY="$PWD/src-tauri/target/debug/cadence-headless" \
            python3 -m unittest discover -s tests/engine -v

      - name: Run packaging and release script tests
        run: |
          python3 -m unittest discover -s deploy/playback-engine -p "test_*.py" -v
          python3 -m unittest discover -s scripts/release -p "test_*.py" -v
          sh -n deploy/playback-engine/install.sh
          bash -n \
            deploy/playback-engine/install.sh \
            deploy/playback-engine/nfpm/preinstall.sh \
            deploy/playback-engine/nfpm/postinstall.sh \
            deploy/playback-engine/nfpm/preremove.sh

  rust-windows-desktop:
    name: Rust Windows Desktop & Engine Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pwa/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Build embedded PWA assets and install Node test dependencies
        run: |
          npm ci
          npm ci --prefix pwa
          npm run build:pwa

      - name: Run Windows Desktop Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture --test-threads=1

      - name: Check Windows standalone playback engine build
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features engine-audio --bin cadence-engine

  android-remote:
    name: Android Remote APK Debug Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.pwa == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pwa/android/**/*.gradle*', 'pwa/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor web assets and build debug APK
        run: |
          npm ci --prefix pwa
          npm run --prefix pwa cap:sync
          cd pwa/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

  e2e-gate:
    name: Cross-Platform E2E (Playwright + cadence-headless + PWA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pwa/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend & PWA dependencies and Playwright Chromium
        run: |
          npm ci
          npm ci --prefix pwa
          npx playwright install --with-deps chromium

      - name: Build cadence-headless engine binary
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features bundled-sqlite --bin cadence-headless

      - name: Run Playwright E2E suite (Desktop + Mobile PWA + UPnP Inspector)
        env:
          CADENCE_ENGINE_BINARY: ${{ github.workspace }}/src-tauri/target/debug/cadence-headless
          CADENCE_SKIP_CARGO_BUILD: '1'
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          npm run test:e2e

      - name: Upload Playwright report & failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 14
