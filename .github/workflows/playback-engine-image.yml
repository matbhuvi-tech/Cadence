name: Publish Playback Engine image
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute build identity
        id: build_meta
        shell: bash
        run: |
          RAW_DESC=$(git describe --tags --long --always 2>/dev/null || echo "")
          SHA=$(git log -1 --format=%h 2>/dev/null || echo "${GITHUB_SHA:0:7}")
          DATE=$(git log -1 --format=%cs 2>/dev/null || echo "")
          SUMMARY=$(git log -1 --format=%s 2>/dev/null | tr -d '\r\n' || echo "")
          TAG=""
          COMMITS="0"
          if [[ "$RAW_DESC" =~ ^(.+)-([0-9]+)-g([0-9a-fA-F]+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            COMMITS="${BASH_REMATCH[2]}"
            SHA="${BASH_REMATCH[3]}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" && -n "${{ github.event.release.tag_name }}" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          {
            echo "tag=$TAG"
            echo "commits=$COMMITS"
            echo "sha=$SHA"
            echo "date=$DATE"
            echo "summary=$SUMMARY"
          } >> "$GITHUB_OUTPUT"
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cadence-playback-engine" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/playback-engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADENCE_VERSION=${{ github.event.release.tag_name || github.sha }}
            CADENCE_BUILD_TAG=${{ steps.build_meta.outputs.tag }}
            CADENCE_BUILD_COMMITS_SINCE_TAG=${{ steps.build_meta.outputs.commits }}
            CADENCE_BUILD_SHA=${{ steps.build_meta.outputs.sha }}
            CADENCE_BUILD_DATE=${{ steps.build_meta.outputs.date }}
            CADENCE_BUILD_SUMMARY=${{ steps.build_meta.outputs.summary }}
      - name: Attach guided installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cadence-installer"
          python3 -c 'import os,pathlib; p=pathlib.Path("deploy/playback-engine/install.sh"); pathlib.Path(os.environ["RUNNER_TEMP"],"cadence-installer","install.sh").write_text(p.read_text().replace("__CADENCE_RELEASE_TAG__",os.environ["RELEASE_TAG"]))'
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/cadence-installer/install.sh" \
            deploy/playback-engine/install.py \
            deploy/playback-engine/compose.yml \
            --clobber
