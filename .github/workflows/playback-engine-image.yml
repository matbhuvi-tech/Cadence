name: Publish Playback Engine image
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cadence-playback-engine" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/playback-engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADENCE_VERSION=${{ github.event.release.tag_name || github.sha }}
      - name: Attach guided installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cadence-installer"
          python3 -c 'import os,pathlib; p=pathlib.Path("deploy/playback-engine/install.sh"); pathlib.Path(os.environ["RUNNER_TEMP"],"cadence-installer","install.sh").write_text(p.read_text().replace("__CADENCE_RELEASE_TAG__",os.environ["RELEASE_TAG"]))'
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/cadence-installer/install.sh" deploy/playback-engine/install.py
