<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" fill="none">
  <defs>
    <radialGradient id="tileBg" cx="30%" cy="20%" r="110%">
      <stop offset="0%" stop-color="#1E1D1F" />
      <stop offset="70%" stop-color="#121214" />
      <stop offset="100%" stop-color="#0C0C0E" />
    </radialGradient>
    <linearGradient id="goldSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4CF" />
      <stop offset="28%" stop-color="#FFD573" />
      <stop offset="55%" stop-color="#D9A838" />
      <stop offset="78%" stop-color="#AA791C" />
      <stop offset="100%" stop-color="#FFD573" />
    </linearGradient>
    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#F5CF6D" />
      <stop offset="100%" stop-color="#C8962E" />
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Emblem Tile -->
  <g transform="translate(146, 12)" filter="url(#tileShadow)">
    <rect width="128" height="128" rx="28" fill="url(#tileBg)" stroke="#D9A838" stroke-opacity="0.32" stroke-width="1.5" />
    <rect x="3" y="3" width="122" height="122" rx="25" stroke="#FFF4CF" stroke-opacity="0.08" stroke-width="1" />

    <!-- Concentric C Arcs -->
    <g transform="translate(4, 4)">
      <g stroke="#050506" stroke-width="6.8" stroke-linecap="round" opacity="0.85" transform="translate(0, 2.5)">
        <path d="M 89.43 27.27 A 44 44 0 1 0 89.43 92.73" />
        <path d="M 81.40 36.20 A 32 32 0 1 0 81.40 83.80" />
        <path d="M 73.38 45.12 A 20 20 0 1 0 73.38 74.88" />
      </g>
      <g stroke="url(#goldSheenGrad)" stroke-linecap="round">
        <path d="M 89.43 27.27 A 44 44 0 1 0 89.43 92.73" stroke-width="6.5" />
        <path d="M 81.40 36.20 A 32 32 0 1 0 81.40 83.80" stroke-width="5.8" />
        <path d="M 73.38 45.12 A 20 20 0 1 0 73.38 74.88" stroke-width="5.2" />
      </g>
    </g>
  </g>

  <!-- Brand Wordmark Pill (high contrast on both light and dark GitHub themes) -->
  <rect x="45" y="156" width="330" height="78" rx="16" fill="#0D0E12" stroke="#D9A838" stroke-opacity="0.28" stroke-width="1" filter="url(#tileShadow)" />
  <text x="216" y="194" text-anchor="middle" fill="url(#textGoldGrad)" font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="700" letter-spacing="11">CADENCE</text>
  <text x="214" y="218" text-anchor="middle" fill="#D9A838" fill-opacity="0.85" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" letter-spacing="5.5">PRECISION AUDIO ENGINE</text>
</svg>

